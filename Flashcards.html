
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>75 Flashcards - Smart Industry Readiness Index</title>
    <style>
        :root {
            --primary: #002d72; --secondary: #00a1e1; --bg: #f8f9fa; --text: #212529;
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: var(--primary); margin: 0; }
        .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; max-width: 1300px; width: 100%; }
        .card { height: 220px; perspective: 1000px; cursor: pointer; }
        .card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-radius: 12px; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; border-radius: 12px; }
        .card-front { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; }
        .card-back { background: white; color: var(--text); transform: rotateY(180deg); border: 2px solid var(--primary); font-size: 0.9em; overflow-y: auto; }
        .tag { position: absolute; top: 10px; left: 10px; font-size: 0.7em; background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 4px; }
        .title { font-weight: bold; font-size: 1.1em; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Mestre da Indústria 4.0 - SIRI</h1>
        <p>75 Conceitos extraídos dos Manuais Oficiais</p>
    </div>

    <div class="container" id="flashcards"></div>

            { cat: "Bloco", t: "Organização", d: "Cobre a prontidão de talentos, estrutura organizacional e gestão estratégica." },

            { cat: "KPI", t: "Time to Market", d: "Tempo necessário para conceber, desenvolver e lançar um novo produto no mercado [40]." },

            // GLOSSÁRIO E FRAMEWORKS (24)
            { cat: "Framework", t: "LEAD - Passo 1: Aprender", d: "Construir uma linguagem comum e entender os conceitos da Indústria 4.0 [42]." },
            { cat: "Framework", t: "LEAD - Passo 2: Avaliar", d: "Usar a Matriz SIRI para diagnosticar o estado de maturidade atual da fábrica [42]." },

            { cat: "Framework", t: "TIER - T (Today's State)", d: "Princípio de entender a maturidade atual da empresa antes de priorizar [43]." },

            { cat: "Glossário", t: "Big Data", d: "Dados com volume e velocidade que exigem novas tecnologias para extrair valor [52]." },
            { cat: "Glossário", t: "Fábrica Inteligente", d: "Instalação onde a integração permite auto-organização e auto-otimização [53]." },

            { cat: "Conceito", t: "Banda 2: Digital", d: "Processos digitais executados por humanos; uso de ferramentas IT/OT em silos [55]." },

            { cat: "Conceito", t: "Banda 4: Automatizado", d: "Troca de dados ocorre entre máquinas e sistemas com intervenção humana limitada [56]." },
            { cat: "Conceito", t: "Banda 5: Inteligente", d: "Sistemas analisam dados e reagem autonomamente para otimizar processos [57]." }
        ];

        const container = document.getElementById('flashcards');

        cards.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => card.classList.toggle('flipped');
            
            card.innerHTML = `
                <div class="card-inner">
                    <div class="card-front">
                        <span class="tag">${item.cat} (${index + 1}/75)</span>
                        <div class="title">${item.t}</div>
                    </div>
                    <div class="card-back">
                        <strong>DEFINIÇÃO:</strong><br>
                        <p>${item.d}</p>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    </script>
</body>
</html>

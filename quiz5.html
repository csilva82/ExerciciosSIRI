
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIRI Quiz – Atividade 5</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#1a5f6e;--teal2:#1e7a8f;--teal-light:#d4eef4;
  --bp:#eaf3fa;--bm:#b8d0e8;
  --txt:#1a2b35;--muted:#5a7280;--white:#fff;
  --ok:#1d6b48;--ok-bg:#d2f0e2;
  --ng:#b72b1f;--ng-bg:#fde8e6;
  --shadow:0 3px 14px rgba(0,0,0,.10);--r:8px;
}
body{font-family:'Inter',sans-serif;background:#eef4f8;color:var(--txt);min-height:100vh}
nav{background:var(--teal);padding:13px 24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
nav .brand{color:#fff;font-weight:700;font-size:.95rem;margin-right:6px}
nav a{color:#fff;text-decoration:none;font-size:.82rem;font-weight:600;padding:6px 14px;border-radius:20px;border:1.5px solid rgba(255,255,255,.35);transition:.15s}
nav a:hover,nav a.active{background:rgba(255,255,255,.2)}
.wrap{max-width:780px;margin:0 auto;padding:28px 16px 64px}
.quiz-header{text-align:center;margin-bottom:22px}
.quiz-header h1{font-size:1.4rem;font-weight:700;color:var(--teal)}
.quiz-header p{font-size:.87rem;color:var(--muted);margin-top:5px}
.scorebar{display:flex;justify-content:space-between;align-items:center;background:var(--white);border:0.5px solid var(--bm);border-radius:var(--r);padding:9px 16px;margin-bottom:16px;font-size:.85rem;gap:8px;flex-wrap:wrap;box-shadow:var(--shadow)}
.scorebar strong{color:var(--teal)}
.btn-reset{padding:6px 14px;background:transparent;border:1.5px solid var(--bm);border-radius:var(--r);font-size:.8rem;cursor:pointer;color:var(--muted)}
.btn-reset:hover{background:var(--bp)}
.prog-wrap{margin-bottom:16px}
.prog-info{display:flex;justify-content:space-between;font-size:.77rem;color:var(--muted);margin-bottom:5px}
.prog-bg{background:var(--bm);border-radius:20px;height:7px}
.prog-bar{background:var(--teal2);border-radius:20px;height:7px;transition:width .4s}
.q-card{background:var(--white);border-radius:12px;padding:24px 22px 20px;box-shadow:var(--shadow);margin-bottom:14px;animation:fadein .28s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.q-badge{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--teal2);margin-bottom:9px}
.q-text{font-size:.97rem;font-weight:500;line-height:1.65}
.options{margin-top:16px;display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:flex-start;gap:11px;background:var(--bp);border:1.5px solid var(--bm);border-radius:var(--r);padding:11px 13px;cursor:pointer;transition:.15s;font-size:.88rem;line-height:1.5;text-align:left;width:100%}
.opt:hover:not(.disabled){border-color:var(--teal2);background:var(--teal-light)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.ng{background:var(--ng-bg);border-color:var(--ng);color:var(--ng)}
.opt.show-ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.disabled{cursor:default}
.opt-l{min-width:25px;height:25px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.73rem;font-weight:700;background:var(--bm);color:var(--teal);flex-shrink:0;margin-top:1px}
.opt.ok .opt-l,.opt.show-ok .opt-l{background:var(--ok);color:#fff}
.opt.ng .opt-l{background:var(--ng);color:#fff}
.feedback{border-radius:var(--r);padding:12px 15px;font-size:.855rem;margin-top:12px;display:none;line-height:1.6}
.feedback.ok{background:var(--ok-bg);color:var(--ok);border-left:4px solid var(--ok);display:block;border-radius:0 var(--r) var(--r) 0}
.feedback.ng{background:var(--ng-bg);color:var(--ng);border-left:4px solid var(--ng);display:block;border-radius:0 var(--r) var(--r) 0}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}
.btn{padding:9px 22px;border:none;border-radius:var(--r);font-size:.87rem;font-weight:600;cursor:pointer;transition:.15s}
.btn-primary{background:var(--teal);color:#fff}
.btn-primary:hover{background:var(--teal2)}
.btn-secondary{background:transparent;border:1.5px solid var(--bm);color:var(--muted)}
.btn-secondary:hover{background:var(--bp)}
.btn:disabled{opacity:.4;cursor:default}
#score-screen{display:none}
.score-card{background:var(--white);border-radius:14px;padding:34px 26px;box-shadow:var(--shadow);text-align:center}
.sc-emoji{font-size:3.2rem;line-height:1}
.sc-num{font-size:2.8rem;font-weight:700;color:var(--teal);margin:8px 0 3px}
.sc-sub{font-size:.92rem;color:var(--muted)}
.sc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.sc-item{background:var(--bp);border-radius:var(--r);padding:12px 8px}
.sc-val{font-size:1.4rem;font-weight:700}
.sc-lbl{font-size:.73rem;color:var(--muted);margin-top:2px}
.ok-c{color:var(--ok)}.ng-c{color:var(--ng)}
.sc-acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.rev-item{background:var(--white);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.rev-q{font-size:.86rem;font-weight:600;margin-bottom:7px}
.rev-a{font-size:.81rem}
.rev-a.ok{color:var(--ok)}.rev-a.ng{color:var(--ng)}
.rev-c{font-size:.78rem;color:var(--ok);margin-top:3px}
.rev-exp{font-size:.78rem;color:var(--muted);margin-top:5px;font-style:italic}
.study-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.study-nav button{padding:7px 16px;border:1.5px solid var(--bm);border-radius:var(--r);background:transparent;color:var(--muted);font-size:.83rem;cursor:pointer}
.study-nav button:hover{background:var(--bp)}
.study-nav .sn-num{font-size:.85rem;color:var(--teal);font-weight:600}
.reveal-btn{margin-top:14px;padding:8px 18px;background:var(--teal);color:#fff;border:none;border-radius:var(--r);font-size:.85rem;cursor:pointer}
.answer-box{background:var(--ok-bg);color:var(--ok);border-left:4px solid var(--ok);border-radius:0 var(--r) var(--r) 0;padding:12px 15px;font-size:.87rem;margin-top:12px;display:none;line-height:1.6}
.mode-row{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.mode-btn{padding:6px 18px;border-radius:20px;border:1.5px solid var(--teal);background:transparent;color:var(--teal);font-size:.82rem;font-weight:600;cursor:pointer;transition:.15s}
.mode-btn.active{background:var(--teal);color:#fff}
@media(max-width:480px){.sc-grid{grid-template-columns:1fr 1fr}.q-card{padding:16px 12px}}
</style>
</head>
<body>

<nav>
  <span class="brand">SIRI Quiz</span>
  <a href="index.html" style="margin-left:auto">⬅ Voltar</a>
</nav>

<div class="wrap">
  <div class="quiz-header">
    <h1>Atividade 4 – Questões da Prova SIRI</h1>
    
  </div>

  <div class="scorebar" id="scorebar">
    <span>Acertos: <strong id="sv">0</strong></span>
    <span>Erros: <strong id="ev">0</strong></span>
    <span id="prog-txt" style="color:var(--muted);font-size:.8rem"></span>
    <button class="btn-reset" onclick="resetAll()">↺ Reiniciar</button>
  </div>

  <!-- QUIZ -->
  <div id="quiz-mode">
    <div class="prog-wrap">
      <div class="prog-info"><span id="prog-lbl"></span><span id="prog-pct"></span></div>
      <div class="prog-bg"><div class="prog-bar" id="prog-bar" style="width:0%"></div></div>
    </div>
    <div class="q-card" id="q-card">
      <div class="q-badge" id="q-badge"></div>
      <div class="q-text"  id="q-text"></div>
      <div class="options" id="q-opts"></div>
      <div class="feedback" id="q-fb"></div>
    </div>
    <div class="actions">
      <button class="btn btn-secondary" id="btn-skip" onclick="skip()">Pular</button>
      <button class="btn btn-primary"   id="btn-next" onclick="next()" disabled>Próxima →</button>
    </div>
  </div>

  <!-- STUDY -->
  <div id="study-mode" style="display:none">
    <div class="study-nav">
      <button onclick="studyPrev()">← Anterior</button>
      <span class="sn-num" id="sn-num"></span>
      <button onclick="studyNext()">Próxima →</button>
    </div>
    <div class="q-card">
      <div class="q-badge" id="sn-badge"></div>
      <div class="q-text"  id="sn-text"></div>
      <div class="options" id="sn-opts" style="pointer-events:none"></div>
      <button class="reveal-btn" onclick="revealAnswer()">Revelar Resposta</button>
      <div class="answer-box" id="sn-ans"></div>
    </div>
  </div>

  <!-- SCORE -->
  <div id="score-screen">
    <div class="score-card">
      <div class="sc-emoji" id="sc-emoji"></div>
      <div class="sc-num"   id="sc-num"></div>
      <div class="sc-sub"   id="sc-sub"></div>
      <div class="sc-grid">
        <div class="sc-item"><div class="sc-val ok-c" id="sc-ok"></div><div class="sc-lbl">Corretas</div></div>
        <div class="sc-item"><div class="sc-val ng-c" id="sc-ng"></div><div class="sc-lbl">Erradas</div></div>
        <div class="sc-item"><div class="sc-val"      id="sc-sk"></div><div class="sc-lbl">Puladas</div></div>
      </div>
      <div class="sc-acts">
        <button class="btn btn-primary"   onclick="resetAll()">↺ Refazer</button>
        <button class="btn btn-secondary" onclick="toggleReview()">📋 Revisão</button>
      </div>
    </div>
    <div id="rev-section" style="display:none;margin-top:22px">
      <h3 style="font-size:.98rem;color:var(--teal);margin-bottom:12px">Revisão das Respostas</h3>
      <div id="rev-items"></div>
    </div>
  </div>
</div>

<script>
const L=['A','B','C','D'];
const QS=[
  // Q1
  {q:'O CSA deve colocar os interesses de seus clientes como prioridade máxima e recomendar estritamente uma solução com base nos níveis de maturidade SIRI e interesses organizacionais do cliente. Eles devem se abster de buscar benefícios profissionais para seu próprio empregador. Este é um dos exemplos de:',
   op:['Lealdade, Prudência e Cuidado','Preservação da Confidencialidade','Negociação Justa','Nenhuma das opções acima'],
   r:0,
   exp:'Este é um exemplo de Lealdade, Prudência e Cuidado — o CSA deve priorizar os interesses do cliente e evitar conflitos com os interesses do seu empregador.'},
  // Q2
  {q:'O CSA precisa armazenar documentos, relatórios e outras entregas durante a avaliação SIRI para referência futura. Eles devem arquivar os documentos do cliente e qualquer material sensível de uma maneira que proteja a confidencialidade do cliente. Este exemplo é parte de:',
   op:['Diligência e base razoável','Comunicação com clientes atuais e clientes potenciais','Retenção de registros','Nenhuma das opções acima'],
   r:2,
   exp:'Arquivar documentos e materiais sensíveis protegendo a confidencialidade é um exemplo de Retenção de Registros, uma obrigação profissional do CSA.'},
  // Q3
  {q:'O CSA deverá preparar e compartilhar a agenda da reunião com antecedência:',
   op:['Para orientar os participantes da reunião de volta ao caminho caso alguém desvie do assunto','Para ter uma discussão difícil','Respeitar o horário do CSA','Nenhuma das opções acima'],
   r:0,
   exp:'A agenda é compartilhada previamente para orientar os participantes e manter o foco, evitando desvios do assunto principal durante a reunião.'},
  // Q4
  {q:'A etiqueta empresarial é importante porque cria:',
   op:['Atmosfera competitiva','Conflitos e mal-entendidos','Atmosfera de respeito mútuo','Nenhuma das opções acima'],
   r:2,
   exp:'A etiqueta empresarial cria uma atmosfera de respeito mútuo, facilitando relações profissionais saudáveis e colaborativas.'},
  // Q5
  {q:'Qual é o principal benefício da integração vertical na Indústria 4.0?',
   op:['Ganho de eficiência; transferência clara de informações entre o planejamento de negócios e os processos de produção','Melhorar a qualidade e a flexibilidade das operações de fabricação','Agilidade; insights e análises de fábrica em tempo real','Todas as opções acima'],
   r:3,
   exp:'A integração vertical oferece todos esses benefícios: eficiência, melhoria de qualidade e flexibilidade, além de agilidade com análises em tempo real.'},
  // Q6
  {q:'Quais são as três dimensões do modelo RAMI 4.0 que constituem a base para a discussão das inter-relações e detalhes da Indústria 4.0?',
   op:['Ciclo de vida do produto, Níveis de hierarquia, IEC 62264','Tempo, Custo, Qualidade','Integração Vertical, Integração Horizontal, Ciclo de Vida do Produto','Camadas de arquitetura, Níveis de hierarquia, Ciclo de vida e Fluxo de valor'],
   r:3,
   exp:'As três dimensões do RAMI 4.0 são: Camadas de Arquitetura, Níveis de Hierarquia e Ciclo de Vida e Fluxo de Valor.'},
  // Q7
  {q:'Existem padrões específicos de conduta profissional para o CSA demonstrar suas responsabilidades para com seus empregadores individuais. Estes incluem:',
   op:['Negociação Justa','Lealdade / Fidelidade','Apresentação de desempenho','Todas as opções acima'],
   r:3,
   exp:'As responsabilidades do CSA para com seus empregadores incluem Negociação Justa, Lealdade/Fidelidade e Apresentação de Desempenho — todas as opções.'},
  // Q8
  {q:'Os processos de design e desenvolvimento de um produto são executados utilizando ferramentas analógicas. As especificações do produto são então comunicadas à equipe de chão de fábrica por meio de desenhos em papel e emails. O feedback do cliente é recebido por meio de vários canais, como e-mail e telefone.',
   op:['Integração do Ciclo de Vida do Produto: Banda 0 Indefinida','Integração do Ciclo de Vida do Produto: Banda 1 Definida','Integração do Ciclo de Vida do Produto: Banda 2 Digital','Integração do Ciclo de Vida do Produto: Banda 4 Automatizado'],
   r:1,
   exp:'O uso de ferramentas analógicas com processos básicos definidos indica Integração do Ciclo de Vida do Produto: Banda 1 Definida.'},
  // Q9
  {q:'O sistema de chão de fábrica pode monitorar e gerar um alerta quando houver paradas de máquinas. O sistema também pode fornecer o código de erro, realizar análise de causa raiz e gerar um conjunto de falhas potenciais. As informações podem ser recuperadas e transferidas automaticamente para o fabricante original do equipamento (OEM) para análise posterior.',
   op:['Automação no Chão de Fábrica: Banda 2 Avançada','Automação no Chão de Fábrica: Banda 3 Completa','Conectividade no Chão de Fábrica: Banda 1 Conectada','Inteligência no Chão de Fábrica: Banda 3 Diagnóstico'],
   r:3,
   exp:'A capacidade de análise de causa raiz, geração de alertas e transferência automática para o OEM caracteriza Inteligência no Chão de Fábrica: Banda 3 Diagnóstico.'},
  // Q10
  {q:'Um CSA pode aceitar presentes, benefícios ou compensações de um cliente:',
   op:['Se o Conselho de Administração do cliente aceitar os acordos','Se obtiverem consentimento por escrito de todas as partes envolvidas','Se a administração do cliente concordar com o acordo','Nenhuma das opções acima'],
   r:3,
   exp:'O CSA não deve aceitar presentes, benefícios ou compensações de clientes em nenhuma circunstância, pois isso compromete sua independência e objetividade.'},
  // Q11
  {q:'Qual é o foco principal da Indústria 4.0?',
   op:['Automação','Digitalização e Interconectividade','Fabricação just-in-time','Terceirização'],
   r:1,
   exp:'O foco principal da Indústria 4.0 é a Digitalização e Interconectividade — integrar sistemas digitais, máquinas e pessoas de forma conectada e inteligente.'},
  // Q12
  {q:'O sistema de gestão de estoque da empresa pode processar e analisar o saldo de matérias-primas e consumíveis de acordo com a necessidade pré-definida. Os sistemas de TI dos departamentos de RH e Financeiro podem gerar um alerta e informar a pessoa responsável quando há um desvio de um parâmetro predefinido.',
   op:['Automação na Empresa: Banda 2 Avançada','Integração Horizontal: Banda 4 Automatizada','Inteligência na Empresa: Banda 2 Visível','Inteligência no Chão de Fábrica: Banda 3 Diagnóstico'],
   r:1,
   exp:'A integração automatizada entre departamentos (estoque, RH, Financeiro) com alertas automáticos indica Integração Horizontal: Banda 4 Automatizada.'},
  // Q13
  {q:'O chão de fábrica está equipado com diversos tipos de máquinas de Controle Numérico Computadorizado (CNC) e os processos produtivos são executados com limitada intervenção humana. Porém, a movimentação de produtos ou peças é realizada manualmente por equipamentos como empilhadeiras.',
   op:['Automação no Chão de Fábrica: Banda 2 Avançada','Automação no Chão de Fábrica: Banda 3 Completa','Inteligência no Chão de Fábrica: Banda 1 Informatizada','Inteligência no Chão de Fábrica: Banda 2 Visível'],
   r:0,
   exp:'Máquinas CNC com limitada intervenção humana, mas movimentação ainda manual, caracteriza Automação no Chão de Fábrica: Banda 2 Avançada.'},
  // Q14
  {q:'Os processos de produção são gerenciados com sistemas integrados baseados em computador, como ERP, PLM, MES e WMS. Os humanos gerenciam predominantemente a troca de dados e informações entre diferentes funções.',
   op:['Integração Vertical: Banda 4 Automatizada','Integração Horizontal: Banda 3 Integrada','Integração Vertical: Banda 3 Integrada','Integração Horizontal: Banda 4 Automatizada'],
   r:2,
   exp:'Sistemas integrados (ERP, PLM, MES, WMS) com intervenção humana na troca de dados indica Integração Vertical: Banda 3 Integrada.'},
  // Q15
  {q:'Qual é o modelo de referência da SIRI?',
   op:['RAMI 4.0','LEAD Framework','Índice de Maturidade da Indústria 4.0','Nenhuma das opções acima'],
   r:0,
   exp:'O modelo de referência da SIRI é o RAMI 4.0 (Reference Architecture Model Industrie 4.0), que fornece a estrutura para discutir a Indústria 4.0.'},
  // Q16
  {q:'O Building Management System (BMS) pode controlar os ativos das instalações com base em parâmetros predefinidos. O sistema é modernizado com monitoramento de condições para detectar os problemas e fornecer as possíveis causas raízes.',
   op:['Automação nas Instalações: Banda 3 Completa','Automação nas Instalações: Banda 4 Flexível','Inteligência nas Instalações: Banda 3 Diagnóstico','Inteligência nas Instalações: Banda 4 Preditiva'],
   r:2,
   exp:'Monitoramento de condições com detecção de problemas e análise de causas raízes caracteriza Inteligência nas Instalações: Banda 3 Diagnóstico.'},
  // Q17
  {q:'Todos os equipamentos e sistemas no chão de fábrica são controlados pelo CLP e equipados com Andon conectado através do sistema Digital Andon. Se o equipamento não estiver operando conforme os parâmetros, o sistema produzirá um alerta. A manutenção é realizada principalmente em reação a problemas.',
   op:['Inteligência no Chão de Fábrica: Banda 2 Visível','Inteligência nas Instalações: Banda 2 Visível','Automação no Chão de Fábrica: Banda 2 Avançado','Integração Vertical: Banda 2 Digital'],
   r:0,
   exp:'Monitoramento via sistema Digital Andon com alertas visuais, mas manutenção reativa, caracteriza Inteligência no Chão de Fábrica: Banda 2 Visível.'},
  // Q18
  {q:'As informações dos ativos da instalação (caldeira, gerador e compressores de ar) são interconectadas e gerenciadas pelo BMS. No entanto, o nível de segurança do sistema é mínimo e é vulnerável a ameaças externas.',
   op:['Automação nas Instalações: Banda 2 Avançada','Automação nas Instalações: Banda 3 Completa','Conectividade nas instalações: Banda 2 Interoperável','Conectividade nas Instalações: Banda 3 Interoperável e Segura'],
   r:2,
   exp:'Ativos interconectados via BMS, porém com segurança mínima e vulnerável, indica Conectividade nas Instalações: Banda 2 Interoperável (sem segurança robusta).'},
  // Q19
  {q:'Os sistemas de CRM e ERP podem trocar informações em tempo real através de uma rede segura. Os sistemas integrados podem ser ligados a diferentes entidades legais em todo o mundo, e a infraestrutura de rede pode ser reconfigurada rapidamente para acomodar novos requisitos.',
   op:['Conectividade no Chão de Fábrica: Banda 4 Tempo Real','Inteligência na Empresa: Banda 5 Adaptável','Integração Vertical: Banda 4 Automatizada','Conectividade na Empresa: Banda 5 Escalável'],
   r:3,
   exp:'Troca de informações em tempo real com rede segura e infraestrutura reconfiguravelglobalmente indica Conectividade na Empresa: Banda 5 Escalável.'},
  // Q20
  {q:'Como Avaliador Certificado SIRI (CSA), em quais das seguintes áreas você tem o dever de defender para seus clientes?',
   op:['Negociação Justa','Preservação da Confidencialidade','Lealdade, Prudência e Cuidado','Todas as opções acima'],
   r:3,
   exp:'O CSA tem dever de defender seus clientes em todas essas áreas: Negociação Justa, Preservação da Confidencialidade, e Lealdade, Prudência e Cuidado.'},
  // Q21
  {q:'Os processos de produção são gerenciados pelo MES e executados por robôs. Se houver algum erro ou falha nos robôs, os dados relevantes são recuperados automaticamente pelos sensores para análise. O MES é modernizado com Inteligência Artificial (IA) e pode prever a possibilidade de falha e identificar a causa raiz.',
   op:['Automação no Chão de Fábrica: Banda 3 Completa','Automação no Chão de Fábrica: Banda 4 Flexível','Inteligência no Chão de Fábrica: Banda 3 Diagnóstico','Inteligência no Chão de Fábrica: Banda 4 Preditiva'],
   r:3,
   exp:'IA integrada ao MES com capacidade preditiva de falhas caracteriza Inteligência no Chão de Fábrica: Banda 4 Preditiva.'},
  // Q22
  {q:'Qual das alternativas a seguir NÃO é uma aplicação típica de IA na manufatura?',
   op:['Automação de controle de qualidade','Manutenção Preditiva','Gestão de Recursos Humanos','Gestão da cadeia de suprimentos'],
   r:2,
   exp:'Gestão de Recursos Humanos não é uma aplicação típica de IA na manufatura. As aplicações típicas incluem controle de qualidade, manutenção preditiva e gestão da cadeia de suprimentos.'},

let mode='quiz',idx=0,score=0,errs=0,skips=0,answered=false,results=[],studyIdx=0;

function renderQ(){
  answered=false;
  const q=QS[idx];
  document.getElementById('q-badge').textContent='Questão '+(idx+1)+' de '+QS.length;
  document.getElementById('q-text').textContent=q.q;
  document.getElementById('q-fb').className='feedback';
  document.getElementById('btn-next').disabled=true;
  document.getElementById('btn-skip').disabled=false;
  const opts=document.getElementById('q-opts');
  opts.innerHTML='';
  q.op.forEach((op,i)=>{
    const b=document.createElement('button');
    b.className='opt';b.dataset.i=i;
    b.innerHTML=`<span class="opt-l">${L[i]}</span><span>${op}</span>`;
    b.addEventListener('click',()=>pick(i));
    opts.appendChild(b);
  });
  const pct=Math.round(idx/QS.length*100);
  document.getElementById('prog-lbl').textContent='Questão '+(idx+1)+' de '+QS.length;
  document.getElementById('prog-pct').textContent=pct+'%';
  document.getElementById('prog-bar').style.width=pct+'%';
  document.getElementById('prog-txt').textContent='Respondidas: '+idx+'/'+QS.length;
  const c=document.getElementById('q-card');
  c.style.animation='none';requestAnimationFrame(()=>{c.style.animation='';});
}

function pick(chosen){
  if(answered)return;
  answered=true;
  const q=QS[idx];const ok=chosen===q.r;
  document.querySelectorAll('#q-opts .opt').forEach((el,i)=>{
    el.classList.add('disabled');
    if(i===q.r)el.classList.add('show-ok');
    if(i===chosen&&ok)el.classList.add('ok');
    if(i===chosen&&!ok)el.classList.add('ng');
  });
  const fb=document.getElementById('q-fb');
  if(ok){fb.className='feedback ok';fb.textContent='✓ Correto!'+(q.exp?' – '+q.exp:'');score++;}
  else{fb.className='feedback ng';fb.textContent='✗ Incorreto. Resposta: '+L[q.r]+') '+q.op[q.r]+(q.exp?' — '+q.exp:'');errs++;}
  results.push({q,chosen,ok,skipped:false});
  document.getElementById('sv').textContent=score;
  document.getElementById('ev').textContent=errs;
  document.getElementById('btn-next').disabled=false;
  document.getElementById('btn-skip').disabled=true;
}

function skip(){
  if(answered)return;
  results.push({q:QS[idx],chosen:-1,ok:false,skipped:true});
  skips++;next();
}

function next(){
  idx++;
  if(idx>=QS.length){showScore();return;}
  renderQ();
}

function showScore(){
  document.getElementById('quiz-mode').style.display='none';
  document.getElementById('score-screen').style.display='';
  document.getElementById('scorebar').style.display='none';
  const pct=Math.round(score/QS.length*100);
  document.getElementById('sc-emoji').textContent=pct>=80?'🎉':pct>=60?'👍':'📚';
  document.getElementById('sc-num').textContent=pct+'%';
  document.getElementById('sc-sub').textContent=score+' de '+QS.length+' corretas';
  document.getElementById('sc-ok').textContent=score;
  document.getElementById('sc-ng').textContent=errs;
  document.getElementById('sc-sk').textContent=skips;
  document.getElementById('prog-bar').style.width='100%';
  document.getElementById('prog-pct').textContent='100%';
}

function toggleReview(){
  const sec=document.getElementById('rev-section');
  if(sec.style.display!=='none'){sec.style.display='none';return;}
  sec.style.display='';
  const c=document.getElementById('rev-items');c.innerHTML='';
  results.forEach((r,i)=>{
    const d=document.createElement('div');d.className='rev-item';
    let h=`<div class="rev-q">${i+1}. ${r.q.q}</div>`;
    if(r.skipped)h+=`<div class="rev-a" style="color:var(--muted)">Pulada — correta: ${L[r.q.r]}) ${r.q.op[r.q.r]}</div>`;
    else if(r.ok)h+=`<div class="rev-a ok">✓ ${L[r.chosen]}) ${r.q.op[r.chosen]}</div>`;
    else{h+=`<div class="rev-a ng">✗ Sua: ${L[r.chosen]}) ${r.q.op[r.chosen]}</div>`;h+=`<div class="rev-c">✓ Correta: ${L[r.q.r]}) ${r.q.op[r.q.r]}</div>`;}
    if(r.q.exp)h+=`<div class="rev-exp">${r.q.exp}</div>`;
    d.innerHTML=h;c.appendChild(d);
  });
}

function renderStudy(){
  const q=QS[studyIdx];
  document.getElementById('sn-badge').textContent='Questão '+(studyIdx+1)+' de '+QS.length;
  document.getElementById('sn-text').textContent=q.q;
  document.getElementById('sn-ans').style.display='none';
  const opts=document.getElementById('sn-opts');opts.innerHTML='';
  q.op.forEach((op,i)=>{
    const b=document.createElement('button');b.className='opt disabled';
    b.innerHTML=`<span class="opt-l">${L[i]}</span><span>${op}</span>`;
    opts.appendChild(b);
  });
  document.getElementById('sn-num').textContent=(studyIdx+1)+' / '+QS.length;
}

function revealAnswer(){
  const q=QS[studyIdx];
  document.querySelectorAll('#sn-opts .opt').forEach((el,i)=>{if(i===q.r)el.classList.add('show-ok');});
  const a=document.getElementById('sn-ans');
  a.textContent='✓ '+L[q.r]+') '+q.op[q.r]+(q.exp?' — '+q.exp:'');
  a.style.display='block';
}

function studyNext(){studyIdx=(studyIdx+1)%QS.length;renderStudy();}
function studyPrev(){studyIdx=(studyIdx-1+QS.length)%QS.length;renderStudy();}

function setMode(m){
  mode=m;
  document.querySelectorAll('.mode-btn').forEach((b,i)=>b.classList.toggle('active',['quiz','study'][i]===m));
  document.getElementById('quiz-mode').style.display=m==='quiz'?'':'none';
  document.getElementById('study-mode').style.display=m==='study'?'':'none';
  document.getElementById('score-screen').style.display='none';
  document.getElementById('scorebar').style.display=m==='quiz'?'':'none';
  if(m==='study')renderStudy();
}

function resetAll(){
  idx=0;score=0;errs=0;skips=0;results=[];
  document.getElementById('sv').textContent='0';
  document.getElementById('ev').textContent='0';
  document.getElementById('score-screen').style.display='none';
  document.getElementById('rev-section').style.display='none';
  document.getElementById('scorebar').style.display=mode==='quiz'?'':'none';
  if(mode==='quiz'){document.getElementById('quiz-mode').style.display='';renderQ();}
  else renderStudy();
}

renderQ();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIRI – Jogo de Treinamento</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --teal-dark:  #1a5f6e;
    --teal:       #1e7a8f;
    --teal-light: #d6eef3;
    --blue-pale:  #dce8f5;
    --blue-mid:   #b8d0e8;
    --text-dark:  #1a2b35;
    --text-mid:   #3a5060;
    --text-light: #637a88;
    --white:      #ffffff;
    --success:    #2e7d52;
    --success-bg: #d4f0e2;
    --error:      #c0392b;
    --error-bg:   #fde8e6;
    --warn:       #7a5a00;
    --warn-bg:    #fff3cd;
    --shadow:     0 2px 8px rgba(0,0,0,.12);
    --radius:     6px;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: #f0f6fa;
    color: var(--text-dark);
    min-height: 100vh;
    padding: 24px 16px 48px;
  }

  .page-header { text-align: center; margin-bottom: 32px; }
  .page-header h1 { font-size: 1.75rem; font-weight: 700; color: var(--teal-dark); letter-spacing: -.5px; }
  .page-header p  { margin-top: 6px; color: var(--text-light); font-size: .95rem; }

  .mode-tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 28px; flex-wrap: wrap; }
  .mode-btn {
    padding: 8px 20px; border-radius: 20px; border: 2px solid var(--teal);
    background: transparent; color: var(--teal); font-weight: 600; font-size: .875rem;
    cursor: pointer; transition: all .2s;
  }
  .mode-btn.active, .mode-btn:hover { background: var(--teal); color: var(--white); }

  .game-wrap { max-width: 1100px; margin: 0 auto; }

  .score-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--white); border-radius: var(--radius); padding: 12px 20px;
    margin-bottom: 20px; box-shadow: var(--shadow); flex-wrap: wrap; gap: 8px;
  }
  .score-bar span { font-size: .9rem; color: var(--text-mid); }
  .score-bar strong { color: var(--teal-dark); }
  .btn-reset {
    padding: 7px 16px; background: var(--teal); color: var(--white);
    border: none; border-radius: var(--radius); cursor: pointer;
    font-size: .85rem; font-weight: 600; transition: background .2s;
  }
  .btn-reset:hover { background: var(--teal-dark); }

  #toast {
    position: fixed; top: 20px; right: 20px; padding: 12px 20px;
    border-radius: var(--radius); font-weight: 600; font-size: .9rem;
    box-shadow: var(--shadow); opacity: 0; transition: opacity .3s;
    pointer-events: none; z-index: 999;
  }
  #toast.show { opacity: 1; }
  #toast.correct { background: var(--success-bg); color: var(--success); border-left: 4px solid var(--success); }
  #toast.wrong   { background: var(--error-bg);   color: var(--error);   border-left: 4px solid var(--error); }

  /* MODE 1 */
  .m1-layout { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; align-items: start; }

  .dim-pool { background: var(--white); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
  .dim-pool h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-light); margin-bottom: 12px; }
  .dim-chip {
    background: var(--blue-pale); border: 2px solid var(--blue-mid); border-radius: var(--radius);
    padding: 9px 12px; margin-bottom: 8px; font-size: .85rem; font-weight: 500;
    cursor: grab; transition: transform .15s, box-shadow .15s, opacity .2s; user-select: none;
  }
  .dim-chip:active { cursor: grabbing; }
  .dim-chip.dragging { opacity: .4; transform: scale(.97); }
  .dim-chip.placed { opacity: .35; cursor: default; pointer-events: none; }
  .dim-chip.correct-placed { background: var(--success-bg); border-color: var(--success); color: var(--success); opacity: 1; pointer-events: none; cursor: default; }

  .pillars-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .pillar-slot {
    background: var(--white); border: 2px dashed var(--blue-mid);
    border-radius: var(--radius); padding: 10px; min-height: 100px;
    transition: border-color .2s, background .2s;
  }
  .pillar-slot.drag-over { border-color: var(--teal); background: var(--teal-light); }
  .pillar-slot h4 { font-size: .82rem; font-weight: 700; color: var(--teal-dark); margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--blue-mid); }
  .pillar-slot .slot-items { min-height: 40px; }
  .dropped-chip {
    border-radius: 4px; padding: 6px 10px; font-size: .8rem; font-weight: 500;
    margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center;
  }
  .dropped-chip.correct { background: var(--success-bg); color: var(--success); }
  .dropped-chip.wrong   { background: var(--error-bg);   color: var(--error); }

  /* MODE 2 */
  #mode2 { display: none; }
  .blocks-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
  .block-drop {
    background: var(--white); border: 2px dashed var(--blue-mid);
    border-radius: var(--radius); padding: 12px; min-height: 120px;
    transition: border-color .2s, background .2s;
  }
  .block-drop.drag-over { border-color: var(--teal); background: var(--teal-light); }
  .block-drop h3 {
    font-size: .85rem; font-weight: 700; color: var(--white);
    background: var(--teal-dark); margin: -12px -12px 10px;
    padding: 8px 12px; border-radius: var(--radius) var(--radius) 0 0;
  }
  .pillar-chips-pool { background: var(--white); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
  .pillar-chips-pool h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-light); margin-bottom: 12px; }
  .pillar-chips-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
  .pillar-chip {
    background: var(--blue-pale); border: 2px solid var(--blue-mid); border-radius: var(--radius);
    padding: 8px 14px; font-size: .85rem; font-weight: 500; cursor: grab;
    transition: transform .15s, opacity .2s; user-select: none;
  }
  .pillar-chip:active { cursor: grabbing; }
  .pillar-chip.dragging { opacity: .4; }
  .pillar-chip.placed { opacity: .3; pointer-events: none; cursor: default; }

  /* MODE 3 */
  #mode3 { display: none; }
  .ref-blocks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .ref-block { background: var(--white); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  .ref-block-header { background: var(--teal-dark); color: var(--white); font-weight: 700; font-size: .9rem; padding: 10px 14px; text-align: center; }
  .ref-pillar { border-bottom: 1px solid var(--blue-pale); padding: 10px 14px; }
  .ref-pillar:last-child { border-bottom: none; }
  .ref-pillar-name { font-weight: 600; font-size: .85rem; color: var(--teal); margin-bottom: 5px; }
  .ref-dim { font-size: .8rem; color: var(--text-mid); padding: 2px 0 2px 10px; border-left: 2px solid var(--blue-mid); margin-bottom: 3px; }

  @media (max-width: 700px) {
    .m1-layout { grid-template-columns: 1fr; }
    .blocks-row { grid-template-columns: 1fr; }
    .ref-blocks { grid-template-columns: 1fr; }
  }

  @keyframes shake {
    0%,100%{ transform:translateX(0) }
    25%    { transform:translateX(-6px) }
    75%    { transform:translateX(6px) }
  }
  .shake { animation: shake .35s ease; border-color: var(--error) !important; }
</style>
</head>
<body>

<div class="page-header">
  <h1>Smart Industry Readiness Index</h1>
  <p>Treine o framework SIRI com arrasta e solta</p>
</div>

<div class="mode-tabs">
  <button class="mode-btn active" onclick="setMode(1)">Dimensões → Pilares</button>
  <button class="mode-btn"        onclick="setMode(2)">Pilares → Blocos</button>
  <button class="mode-btn"        onclick="setMode(3)">📋 Referência</button>
</div>

<div class="game-wrap">

  <div class="score-bar" id="scorebar">
    <span>Acertos: <strong id="scoreVal">0</strong></span>
    <span>Erros: <strong id="errVal">0</strong></span>
    <span id="progressTxt"></span>
    <button class="btn-reset" onclick="resetGame()">↺ Reiniciar</button>
  </div>

  <!-- MODE 1 -->
  <div id="mode1">
    <div class="m1-layout">
      <div class="dim-pool">
        <h3>Dimensões (arraste)</h3>
        <div id="dim-chips-container"></div>
      </div>
      <div class="pillars-grid" id="pillars-grid"></div>
    </div>
  </div>

  <!-- MODE 2 -->
  <div id="mode2">
    <div class="blocks-row" id="blocks-row"></div>
    <div class="pillar-chips-pool">
      <h3>Pilares (arraste para o Bloco correto)</h3>
      <div class="pillar-chips-wrap" id="pillar-chips-wrap"></div>
    </div>
  </div>

  <!-- MODE 3 -->
  <div id="mode3">
    <div class="ref-blocks" id="ref-blocks"></div>
  </div>

</div>

<div id="toast"></div>

<script>

  let selectedPillar = null;
  el.addEventListener('click', () => {
  selectedPillar = pkey;
  document.querySelectorAll('.pillar-chip').forEach(c => c.style.outline = '');
  el.style.outline = '2px solid #1e7a8f';
});

  
// ── Data
const BUILDING_BLOCKS = {
  processo:    'Processo',
  tecnologia:  'Tecnologia',
  organizacao: 'Organização',
};

const PILLARS = {
  operacoes:         { label: 'Operações',              block: 'processo' },
  cadeia:            { label: 'Cadeia de Abastecimento', block: 'processo' },
  ciclo_vida:        { label: 'Ciclo de Vida do Produto',block: 'processo' },
  automacao:         { label: 'Automação',              block: 'tecnologia' },
  conectividade:     { label: 'Conectividade',          block: 'tecnologia' },
  inteligencia:      { label: 'Inteligência',           block: 'tecnologia' },
  prontidao_talento: { label: 'Prontidão do Talento',   block: 'organizacao' },
  estrutura_gestao:  { label: 'Estrutura e Gestão',     block: 'organizacao' },
};

const DIMENSIONS = {
  integracao_vertical:   { label: 'Integração Vertical',                             pillar: 'operacoes' },
  integracao_horizontal: { label: 'Integração Horizontal',                           pillar: 'operacoes' },
  ciclo_vida_produto:    { label: 'Ciclo de Vida Integrado do Produto',               pillar: 'ciclo_vida' },
  chao_fabrica:          { label: 'Chão de Fábrica',                                  pillar: 'automacao' },
  empresa:               { label: 'Empresa',                                           pillar: 'automacao' },
  instalacao:            { label: 'Instalação',                                        pillar: 'automacao' },
  aprendizagem:          { label: 'Aprendizagem e Desenvolvimento da Força de Trabalho', pillar: 'prontidao_talento' },
  competencias:          { label: 'Competências de Liderança',                         pillar: 'prontidao_talento' },
  colaboracao:           { label: 'Colaboração Inter e Intraempresarial',              pillar: 'estrutura_gestao' },
  estrategia:            { label: 'Estratégia e Governança',                           pillar: 'estrutura_gestao' },
  conectividade_dim:     { label: 'Conectividade',                                     pillar: 'conectividade' },
  inteligencia_dim:      { label: 'Inteligência',                                      pillar: 'inteligencia' },
  cadeia_dim:            { label: 'Cadeia de Abastecimento',                           pillar: 'cadeia' },
};

// ── State
let score = 0, errs = 0, currentMode = 1;
let dragKey = '', dragType = '';

// ── Build DOM
function buildMode1() {
  const pool = document.getElementById('dim-chips-container');
  pool.innerHTML = '';
  Object.entries(DIMENSIONS).forEach(([key, dim]) => {
    const el = document.createElement('div');
    el.className = 'dim-chip';
    el.id = 'dim_' + key;
    el.draggable = true;
    el.dataset.key = key;
    el.dataset.pillar = dim.pillar;
    el.textContent = dim.label;
    el.addEventListener('dragstart', e => onDragStart(e, 'dim'));
    el.addEventListener('dragend',   e => onDragEnd(e, 'dim'));
    pool.appendChild(el);
  });

  const grid = document.getElementById('pillars-grid');
  grid.innerHTML = '';
  Object.entries(PILLARS).forEach(([pkey, pillar]) => {
    const slot = document.createElement('div');
    slot.className = 'pillar-slot';
    slot.id = 'slot_' + pkey;
    slot.dataset.pillar = pkey;
    slot.innerHTML = `<h4>${pillar.label}</h4><div class="slot-items" id="items_${pkey}"></div>`;
    slot.addEventListener('dragover',  e => { e.preventDefault(); slot.classList.add('drag-over'); });
    slot.addEventListener('dragleave', () => slot.classList.remove('drag-over'));
    slot.addEventListener('drop',      e => onDropDim(e, pkey));
    grid.appendChild(slot);
  });
}

l.addEventListener('click', () => {
  if (!selectedPillar) return;

  const correct = PILLARS[selectedPillar].block === bkey;
  updateScore(correct);

  const chip = document.getElementById('pc_' + selectedPillar);
  if (!chip || chip.classList.contains('placed')) return;

  if (correct) {
    chip.classList.add('placed');
    const div = document.createElement('div');
    div.className = 'dropped-chip correct';
    div.textContent = chip.textContent.trim();
    document.getElementById('bitems_' + bkey).appendChild(div);
  } else {
    chip.classList.add('shake');
    setTimeout(() => chip.classList.remove('shake'), 400);
  }

  selectedPillar = null;
  document.querySelectorAll('.pillar-chip').forEach(c => c.style.outline = '');

  checkComplete2();
});

  const wrap = document.getElementById('pillar-chips-wrap');
  wrap.innerHTML = '';
  Object.entries(PILLARS).forEach(([pkey, pillar]) => {
    const el = document.createElement('div');
    el.className = 'pillar-chip';
    el.id = 'pc_' + pkey;
    el.draggable = true;
    el.dataset.key = pkey;
    el.dataset.block = pillar.block;
    el.textContent = pillar.label;
    el.addEventListener('dragstart', e => onDragStart(e, 'pc'));
    el.addEventListener('dragend',   e => onDragEnd(e, 'pc'));
    wrap.appendChild(el);
  });
}

function buildMode3() {
  const container = document.getElementById('ref-blocks');
  container.innerHTML = '';
  Object.entries(BUILDING_BLOCKS).forEach(([bkey, bname]) => {
    const block = document.createElement('div');
    block.className = 'ref-block';
    let html = `<div class="ref-block-header">${bname}</div>`;
    Object.entries(PILLARS).filter(([,p]) => p.block === bkey).forEach(([pkey, pillar]) => {
      html += `<div class="ref-pillar"><div class="ref-pillar-name">${pillar.label}</div>`;
      Object.values(DIMENSIONS).filter(d => d.pillar === pkey).forEach(dim => {
        html += `<div class="ref-dim">${dim.label}</div>`;
      });
      html += `</div>`;
    });
    block.innerHTML = html;
    container.appendChild(block);
  });
}

// ── Mode switching
function setMode(n) {
  currentMode = n;
  document.querySelectorAll('.mode-btn').forEach((b,i) => b.classList.toggle('active', i === n-1));
  document.getElementById('mode1').style.display = n===1 ? '' : 'none';
  document.getElementById('mode2').style.display = n===2 ? '' : 'none';
  document.getElementById('mode3').style.display = n===3 ? '' : 'none';
  document.getElementById('scorebar').style.display = n===3 ? 'none' : '';
  resetGame();
}

// ── Drag handlers
function onDragStart(e, type) {
  dragKey  = e.currentTarget.dataset.key;
  dragType = type;
  setTimeout(() => e.currentTarget.classList.add('dragging'), 0);
}
function onDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
}

// ── MODE 1: drop dimension on pillar slot
function onDropDim(e, pillarKey) {
  e.preventDefault();
  const slot = document.getElementById('slot_' + pillarKey);
  slot.classList.remove('drag-over');
  if (!dragKey || dragType !== 'dim') return;

  const chip = document.getElementById('dim_' + dragKey);
  if (!chip || chip.classList.contains('placed')) return;

  const correct = DIMENSIONS[dragKey].pillar === pillarKey;
  updateScore(correct);

  if (correct) {
    chip.classList.add('placed');
    const el = document.createElement('div');
    el.className = 'dropped-chip correct';
    el.textContent = chip.textContent.trim();
    document.getElementById('items_' + pillarKey).appendChild(el);
    chip.classList.add('correct-placed');
  } else {
    chip.classList.add('shake');
    setTimeout(() => chip.classList.remove('shake'), 400);
  }

  checkComplete1();
  dragKey = '';
}

function checkComplete1() {
  const total  = Object.keys(DIMENSIONS).length;
  const placed = document.querySelectorAll('#mode1 .dim-chip.placed').length;
  document.getElementById('progressTxt').textContent = `Dimensões colocadas: ${placed}/${total}`;
  if (placed === total) showToast('🎉 Parabéns! Todas as dimensões colocadas corretamente!', 'correct');
}

// ── MODE 2: drop pillar on block
function onDropPillar(e, blockKey) {
  e.preventDefault();
  const block = document.getElementById('block_' + blockKey);
  block.classList.remove('drag-over');
  if (!dragKey || dragType !== 'pc') return;

  const chip = document.getElementById('pc_' + dragKey);
  if (!chip || chip.classList.contains('placed')) return;

  const correct = PILLARS[dragKey].block === blockKey;
  updateScore(correct);

  if (correct) {
    chip.classList.add('placed');
    const el = document.createElement('div');
    el.className = 'dropped-chip correct';
    el.textContent = chip.textContent.trim();
    document.getElementById('bitems_' + blockKey).appendChild(el);
  } else {
    chip.classList.add('shake');
    setTimeout(() => chip.classList.remove('shake'), 400);
  }

  checkComplete2();
  dragKey = '';
}

function checkComplete2() {
  const total  = Object.keys(PILLARS).length;
  const placed = document.querySelectorAll('#mode2 .pillar-chip.placed').length;
  document.getElementById('progressTxt').textContent = `Pilares colocados: ${placed}/${total}`;
  if (placed === total) showToast('🎉 Excelente! Todos os pilares nos blocos corretos!', 'correct');
}

// ── Scoring
function updateScore(correct) {
  if (correct) { score++; showToast('✓ Correto!', 'correct'); }
  else         { errs++;  showToast('✗ Errado — tente novamente', 'wrong'); }
  document.getElementById('scoreVal').textContent = score;
  document.getElementById('errVal').textContent   = errs;
}

// ── Toast
let toastTimer;
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = '', 2000);
}

// ── Reset
function resetGame() {
  score = 0; errs = 0;
  document.getElementById('scoreVal').textContent = '0';
  document.getElementById('errVal').textContent   = '0';
  document.getElementById('progressTxt').textContent = '';

  if (currentMode === 1) { buildMode1(); checkComplete1(); }
  if (currentMode === 2) { buildMode2(); checkComplete2(); }
  if (currentMode === 3) { buildMode3(); }
}

// ── Init
buildMode1();
buildMode2();
buildMode3();
checkComplete1();
</script>
</body>
</html>

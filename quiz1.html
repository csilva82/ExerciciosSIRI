<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIRI – Jogo de Treinamento</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --teal-dark:#1a5f6e; --teal:#1e7a8f; --teal-light:#d6eef3;
    --blue-pale:#dce8f5; --blue-mid:#b8d0e8;
    --text-dark:#1a2b35; --text-mid:#3a5060; --text-light:#637a88;
    --white:#ffffff; --success:#2e7d52; --success-bg:#d4f0e2;
    --error:#c0392b; --error-bg:#fde8e6;
    --shadow:0 2px 8px rgba(0,0,0,.12); --radius:6px;
  }
  body { font-family:'Inter',sans-serif; background:#f0f6fa; color:var(--text-dark); min-height:100vh; padding:24px 16px 48px; }

  .page-header { text-align:center; margin-bottom:32px; }
  .page-header h1 { font-size:1.75rem; font-weight:700; color:var(--teal-dark); letter-spacing:-.5px; }
  .page-header p  { margin-top:6px; color:var(--text-light); font-size:.95rem; }

  .mode-tabs { display:flex; gap:8px; justify-content:center; margin-bottom:28px; flex-wrap:wrap; }
  .mode-btn { padding:8px 20px; border-radius:20px; border:2px solid var(--teal); background:transparent; color:var(--teal); font-weight:600; font-size:.875rem; cursor:pointer; transition:all .2s; }
  .mode-btn.active,.mode-btn:hover { background:var(--teal); color:var(--white); }

  .game-wrap { max-width:1100px; margin:0 auto; }

  .score-bar { display:flex; justify-content:space-between; align-items:center; background:var(--white); border-radius:var(--radius); padding:12px 20px; margin-bottom:20px; box-shadow:var(--shadow); flex-wrap:wrap; gap:8px; }
  .score-bar span { font-size:.9rem; color:var(--text-mid); }
  .score-bar strong { color:var(--teal-dark); }
  .btn-reset { padding:7px 16px; background:var(--teal); color:var(--white); border:none; border-radius:var(--radius); cursor:pointer; font-size:.85rem; font-weight:600; transition:background .2s; }
  .btn-reset:hover { background:var(--teal-dark); }

  /* visibility via class — avoids display:none on build */
  .mode-panel { }
  .mode-panel.hidden { display:none; }

  #toast { position:fixed; top:20px; right:20px; padding:12px 20px; border-radius:var(--radius); font-weight:600; font-size:.9rem; box-shadow:var(--shadow); opacity:0; transition:opacity .3s; pointer-events:none; z-index:999; }
  #toast.show { opacity:1; }
  #toast.correct { background:var(--success-bg); color:var(--success); border-left:4px solid var(--success); }
  #toast.wrong   { background:var(--error-bg); color:var(--error); border-left:4px solid var(--error); }

  /* MODE 1 */
  .m1-layout { display:grid; grid-template-columns:1fr 2fr; gap:20px; align-items:start; }
  .dim-pool { background:var(--white); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); }
  .dim-pool h3 { font-size:.8rem; text-transform:uppercase; letter-spacing:1px; color:var(--text-light); margin-bottom:12px; }
  .dim-chip { background:var(--blue-pale); border:2px solid var(--blue-mid); border-radius:var(--radius); padding:9px 12px; margin-bottom:8px; font-size:.85rem; font-weight:500; cursor:grab; transition:transform .15s,opacity .2s; user-select:none; }
  .dim-chip.dragging { opacity:.4; transform:scale(.97); }
  .dim-chip.placed { opacity:.35; cursor:default; pointer-events:none; background:var(--success-bg); border-color:var(--success); color:var(--success); opacity:1; }
  .pillars-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
  .pillar-slot { background:var(--white); border:2px dashed var(--blue-mid); border-radius:var(--radius); padding:10px; min-height:100px; transition:border-color .2s,background .2s; }
  .pillar-slot.drag-over { border-color:var(--teal); background:var(--teal-light); }
  .pillar-slot h4 { font-size:.82rem; font-weight:700; color:var(--teal-dark); margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid var(--blue-mid); pointer-events:none; }
  .pillar-slot .slot-items { min-height:40px; pointer-events:none; }

  /* MODE 2 */
  .blocks-row { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:24px; }
  .block-drop { background:var(--white); border:2px dashed var(--blue-mid); border-radius:var(--radius); padding:12px; min-height:150px; transition:border-color .2s,background .2s; }
  .block-drop.drag-over { border-color:var(--teal); background:var(--teal-light); }
  .block-drop h3 { font-size:.85rem; font-weight:700; color:var(--white); background:var(--teal-dark); margin:-12px -12px 10px; padding:8px 12px; border-radius:var(--radius) var(--radius) 0 0; pointer-events:none; }
  .block-drop > div { pointer-events:none; }
  .pillar-chips-pool { background:var(--white); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); }
  .pillar-chips-pool h3 { font-size:.8rem; text-transform:uppercase; letter-spacing:1px; color:var(--text-light); margin-bottom:12px; }
  .pillar-chips-wrap { display:flex; flex-wrap:wrap; gap:8px; }
  .pillar-chip { background:var(--blue-pale); border:2px solid var(--blue-mid); border-radius:var(--radius); padding:8px 14px; font-size:.85rem; font-weight:500; cursor:grab; transition:transform .15s,opacity .2s; user-select:none; }
  .pillar-chip.dragging { opacity:.4; }
  .pillar-chip.placed { opacity:.3; pointer-events:none; cursor:default; }

  .dropped-chip { border-radius:4px; padding:6px 10px; font-size:.8rem; font-weight:500; margin-bottom:5px; pointer-events:none; }
  .dropped-chip.correct { background:var(--success-bg); color:var(--success); }

  /* MODE 3 */
  .ref-blocks { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .ref-block { background:var(--white); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); }
  .ref-block-header { background:var(--teal-dark); color:var(--white); font-weight:700; font-size:.9rem; padding:10px 14px; text-align:center; }
  .ref-pillar { border-bottom:1px solid var(--blue-pale); padding:10px 14px; }
  .ref-pillar:last-child { border-bottom:none; }
  .ref-pillar-name { font-weight:600; font-size:.85rem; color:var(--teal); margin-bottom:5px; }
  .ref-dim { font-size:.8rem; color:var(--text-mid); padding:2px 0 2px 10px; border-left:2px solid var(--blue-mid); margin-bottom:3px; }

  @media (max-width:700px) {
    .m1-layout { grid-template-columns:1fr; }
    .blocks-row { grid-template-columns:1fr; }
    .ref-blocks { grid-template-columns:1fr; }
  }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .shake { animation:shake .35s ease; border-color:var(--error) !important; }


  .dim-chip,
.pillar-chip{
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
}
  
</style>
</head>
<body>

<div class="page-header">
  <h1>Smart Industry Readiness Index</h1>
  <p>Treine o framework SIRI com arrasta e solta</p>
</div>

<div class="mode-tabs">
  <button class="mode-btn active" onclick="setMode(1)">Dimensões → Pilares</button>
  <button class="mode-btn"        onclick="setMode(2)">Pilares → Blocos</button>
  <button class="mode-btn"        onclick="setMode(3)">📋 Referência</button>
  <button class="mode-btn" onclick="goHome()">⬅ Voltar</button>
</div>

<div class="game-wrap">
  <div class="score-bar" id="scorebar">
    <span>Acertos: <strong id="scoreVal">0</strong></span>
    <span>Erros: <strong id="errVal">0</strong></span>
    <span id="progressTxt"></span>
    <button class="btn-reset" onclick="resetGame()">↺ Reiniciar</button>
  </div>

  <div id="mode1" class="mode-panel">
    <div class="m1-layout">
      <div class="dim-pool">
        <h3>Dimensões (arraste)</h3>
        <div id="dim-chips-container"></div>
      </div>
      <div class="pillars-grid" id="pillars-grid"></div>
    </div>
  </div>

  <div id="mode2" class="mode-panel hidden">
    <div class="blocks-row" id="blocks-row"></div>
    <div class="pillar-chips-pool">
      <h3>Pilares (arraste para o Bloco correto)</h3>
      <div class="pillar-chips-wrap" id="pillar-chips-wrap"></div>
    </div>
  </div>

  <div id="mode3" class="mode-panel hidden">
    <div class="ref-blocks" id="ref-blocks"></div>
  </div>
</div>

<div id="toast"></div>

<script>
const BUILDING_BLOCKS = {
  processo:'Processo', tecnologia:'Tecnologia', organizacao:'Organização'
};
const PILLARS = {
  operacoes:         { label:'Operações',               block:'processo' },
  cadeia:            { label:'Cadeia de Abastecimento',  block:'processo' },
  ciclo_vida:        { label:'Ciclo de Vida do Produto', block:'processo' },
  AutomacaoConectividadeInteligencia:         { label:'Automação| Conectividade| Inteligência',                block:'tecnologia' },
  prontidao_talento: { label:'Prontidão do Talento',     block:'organizacao' },
  estrutura_gestao:  { label:'Estrutura e Gestão',       block:'organizacao' },
};
const DIMENSIONS = {
  integracao_vertical:   { label:'Integração Vertical',                               pillar:'operacoes' },
  integracao_horizontal: { label:'Integração Horizontal',                             pillar:'operacoes' },
  ciclo_vida_produto:    { label:'Ciclo de Vida Integrado do Produto',                 pillar:'ciclo_vida' },
  chao_fabrica:          { label:'Chão de Fábrica',                                    pillar:'AutomacaoConectividadeInteligencia' },
  empresa:               { label:'Empresa',                                             pillar:'AutomacaoConectividadeInteligencia' },
  instalacao:            { label:'Instalação',                                          pillar:'AutomacaoConectividadeInteligencia' },
  aprendizagem:          { label:'Aprendizagem e Desenvolvimento da Força de Trabalho', pillar:'prontidao_talento' },
  competencias:          { label:'Competências de Liderança',                           pillar:'prontidao_talento' },
  colaboracao:           { label:'Colaboração Inter e Intraempresarial',                pillar:'estrutura_gestao' },
  estrategia:            { label:'Estratégia e Governança',                             pillar:'estrutura_gestao' },
  cadeia_dim:            { label:'Cadeia de Abastecimento',                             pillar:'cadeia' },
};

let score=0, errs=0, currentMode=1, dragKey='', dragType='';

function shuffle(arr){ return arr.sort(()=>Math.random()-.5); }

  // ===== SUPORTE PARA TOUCH (CELULAR) =====

let touchItem = null;

function enableTouchDrag(selector, type){
  document.addEventListener("touchstart", function(e){

    const item = e.target.closest(selector);
    if(!item || item.classList.contains('placed')) return;

    touchItem = item;
    dragType = type;
    dragKey = item.dataset.key;

    item.style.position = "fixed";
    item.style.zIndex = "9999";
    item.style.opacity = "0.8";

  }, {passive:false});

  document.addEventListener("touchmove", function(e){

    if(!touchItem) return;

    const touch = e.touches[0];

    touchItem.style.left = (touch.clientX - touchItem.offsetWidth/2) + "px";
    touchItem.style.top  = (touch.clientY - touchItem.offsetHeight/2) + "px";

    e.preventDefault();

  }, {passive:false});

  document.addEventListener("touchend", function(e){

    if(!touchItem) return;

    const touch = e.changedTouches[0];

    const target = document.elementFromPoint(
      touch.clientX,
      touch.clientY
    );

    // MODE 1
    const pillarSlot = target?.closest(".pillar-slot");
    if(pillarSlot){
      const pillarKey = pillarSlot.id.replace("slot_","");
      dropDim(pillarKey);
    }

    // MODE 2
    const blockDrop = target?.closest(".block-drop");
    if(blockDrop){
      const blockKey = blockDrop.id.replace("block_","");
      dropPillar(blockKey);
    }

    touchItem.style.position = "";
    touchItem.style.left = "";
    touchItem.style.top = "";
    touchItem.style.zIndex = "";
    touchItem.style.opacity = "";

    touchItem = null;

  }, {passive:false});
}

// ── MODE 1
function buildMode1(){
  const pool = document.getElementById('dim-chips-container');
  pool.innerHTML = '';
  shuffle(Object.entries(DIMENSIONS)).forEach(([key,dim])=>{
    const el = document.createElement('div');
    el.className='dim-chip'; el.id='dim_'+key; el.draggable=true;
    el.dataset.key=key; el.textContent=dim.label;
    el.addEventListener('dragstart', e=>{ dragKey=key; dragType='dim'; e.dataTransfer.setData('text/plain',key); setTimeout(()=>el.classList.add('dragging'),0); });
    el.addEventListener('dragend',   ()=>el.classList.remove('dragging'));
    pool.appendChild(el);
  });
  const grid = document.getElementById('pillars-grid');
  grid.innerHTML='';
  Object.entries(PILLARS).forEach(([pkey,pillar])=>{
    const slot=document.createElement('div');
    slot.className='pillar-slot'; slot.id='slot_'+pkey;
    slot.innerHTML=`<h4>${pillar.label}</h4><div class="slot-items" id="items_${pkey}"></div>`;
    slot.addEventListener('dragover', e=>{ e.preventDefault(); slot.classList.add('drag-over'); });
    slot.addEventListener('dragleave', e=>{ if(!slot.contains(e.relatedTarget)) slot.classList.remove('drag-over'); });
    slot.addEventListener('drop', e=>{ e.preventDefault(); slot.classList.remove('drag-over'); dropDim(pkey); });
    grid.appendChild(slot);
  });
}

function dropDim(pillarKey){
  if(!dragKey||dragType!=='dim') return;
  const chip=document.getElementById('dim_'+dragKey);
  if(!chip||chip.classList.contains('placed')) return;
  const correct = DIMENSIONS[dragKey].pillar===pillarKey;
  updateScore(correct);
  if(correct){
    chip.classList.add('placed');
    const el=document.createElement('div');
    el.className='dropped-chip correct'; el.textContent=chip.textContent;
    document.getElementById('items_'+pillarKey).appendChild(el);
  } else {
    chip.classList.add('shake'); setTimeout(()=>chip.classList.remove('shake'),400);
  }
  checkComplete1(); dragKey='';
}

function checkComplete1(){
  const total=Object.keys(DIMENSIONS).length;
  const placed=document.querySelectorAll('#mode1 .dim-chip.placed').length;
  document.getElementById('progressTxt').textContent=`Dimensões colocadas: ${placed}/${total}`;
  if(placed===total) showToast('🎉 Parabéns! Todas as dimensões colocadas!','correct');
}

// ── MODE 2
function buildMode2(){
  const row=document.getElementById('blocks-row');
  row.innerHTML='';
  Object.entries(BUILDING_BLOCKS).forEach(([bkey,bname])=>{
    const el=document.createElement('div');
    el.className='block-drop'; el.id='block_'+bkey;
    el.innerHTML=`<h3>${bname}</h3><div id="bitems_${bkey}"></div>`;
    el.addEventListener('dragover', e=>{ e.preventDefault(); el.classList.add('drag-over'); });
    el.addEventListener('dragleave', e=>{ if(!el.contains(e.relatedTarget)) el.classList.remove('drag-over'); });
    el.addEventListener('drop', e=>{ e.preventDefault(); el.classList.remove('drag-over'); dropPillar(bkey); });
    row.appendChild(el);
  });
  const wrap=document.getElementById('pillar-chips-wrap');
  wrap.innerHTML='';
  shuffle(Object.entries(PILLARS)).forEach(([pkey,pillar])=>{
    const el=document.createElement('div');
    el.className='pillar-chip'; el.id='pc_'+pkey; el.draggable=true;
    el.dataset.key=pkey; el.textContent=pillar.label;
    el.addEventListener('dragstart', e=>{ dragKey=pkey; dragType='pc'; e.dataTransfer.setData('text/plain',pkey); setTimeout(()=>el.classList.add('dragging'),0); });
    el.addEventListener('dragend', ()=>el.classList.remove('dragging'));
    wrap.appendChild(el);
  });
}

function dropPillar(blockKey){
  if(!dragKey||dragType!=='pc') return;
  const chip=document.getElementById('pc_'+dragKey);
  if(!chip||chip.classList.contains('placed')) return;
  const correct = PILLARS[dragKey].block===blockKey;
  updateScore(correct);
  if(correct){
    chip.classList.add('placed');
    const el=document.createElement('div');
    el.className='dropped-chip correct'; el.textContent=chip.textContent;
    document.getElementById('bitems_'+blockKey).appendChild(el);
  } else {
    chip.classList.add('shake'); setTimeout(()=>chip.classList.remove('shake'),400);
  }
  checkComplete2(); dragKey='';
}

function checkComplete2(){
  const total=Object.keys(PILLARS).length;
  const placed=document.querySelectorAll('#mode2 .pillar-chip.placed').length;
  document.getElementById('progressTxt').textContent=`Pilares colocados: ${placed}/${total}`;
  if(placed===total) showToast('🎉 Excelente! Todos os pilares nos blocos corretos!','correct');
}

// ── MODE 3
function buildMode3(){
  const c=document.getElementById('ref-blocks');
  c.innerHTML='';
  Object.entries(BUILDING_BLOCKS).forEach(([bkey,bname])=>{
    const block=document.createElement('div');
    block.className='ref-block';
    let html=`<div class="ref-block-header">${bname}</div>`;
    Object.entries(PILLARS).filter(([,p])=>p.block===bkey).forEach(([pkey,pillar])=>{
      html+=`<div class="ref-pillar"><div class="ref-pillar-name">${pillar.label}</div>`;
      Object.values(DIMENSIONS).filter(d=>d.pillar===pkey).forEach(dim=>{
        html+=`<div class="ref-dim">${dim.label}</div>`;
      });
      html+=`</div>`;
    });
    block.innerHTML=html;
    c.appendChild(block);
  });
}

// ── Switching: toggle .hidden class only
function setMode(n){
  currentMode=n;
  document.querySelectorAll('.mode-btn').forEach((b,i)=>b.classList.toggle('active',i===n-1));
  [1,2,3].forEach(i=>{
    document.getElementById('mode'+i).classList.toggle('hidden', i!==n);
  });
  document.getElementById('scorebar').classList.toggle('hidden', n===3);
  if(n===1) checkComplete1();
  if(n===2) checkComplete2();
}

// ── Score & Toast
function updateScore(correct){
  if(correct){ score++; showToast('✓ Correto!','correct'); }
  else        { errs++;  showToast('✗ Errado — tente novamente','wrong'); }
  document.getElementById('scoreVal').textContent=score;
  document.getElementById('errVal').textContent=errs;
}
let toastTimer;
function showToast(msg,type){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='show '+type;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.className='',2000);
}

// ── Reset
function resetGame(){
  score=0; errs=0;
  document.getElementById('scoreVal').textContent='0';
  document.getElementById('errVal').textContent='0';
  document.getElementById('progressTxt').textContent='';
  if(currentMode===1){ buildMode1(); checkComplete1(); }
  if(currentMode===2){ buildMode2(); checkComplete2(); }
  if(currentMode===3){ buildMode3(); }
}

function goHome(){
  window.location.href = "index.html";
}

// ── Init: build everything while all panels are in the DOM
buildMode1();
buildMode2();
buildMode3();
checkComplete1();

enableTouchDrag('.dim-chip','dim');
enableTouchDrag('.pillar-chip','pc');
</script>
</body>
</html>

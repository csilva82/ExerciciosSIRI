
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIRI Quiz – Questões para a Prova</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#1a5f6e;--teal2:#1e7a8f;--teal-light:#d4eef4;
  --bp:#eaf3fa;--bm:#b8d0e8;
  --txt:#1a2b35;--muted:#5a7280;--white:#fff;
  --ok:#1d6b48;--ok-bg:#d2f0e2;
  --ng:#b72b1f;--ng-bg:#fde8e6;
  --shadow:0 3px 14px rgba(0,0,0,.10);--r:8px;
}
body{font-family:'Inter',sans-serif;background:#eef4f8;color:var(--txt);min-height:100vh}
nav{background:var(--teal);padding:13px 24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
nav .brand{color:#fff;font-weight:700;font-size:.95rem;margin-right:6px}
nav a{color:#fff;text-decoration:none;font-size:.82rem;font-weight:600;padding:6px 14px;border-radius:20px;border:1.5px solid rgba(255,255,255,.35);transition:.15s}
nav a:hover,nav a.active{background:rgba(255,255,255,.2)}
.wrap{max-width:780px;margin:0 auto;padding:28px 16px 64px}
.quiz-header{text-align:center;margin-bottom:22px}
.quiz-header h1{font-size:1.4rem;font-weight:700;color:var(--teal)}
.quiz-header p{font-size:.87rem;color:var(--muted);margin-top:5px}
.mode-row{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.mode-btn{padding:6px 18px;border-radius:20px;border:1.5px solid var(--teal);background:transparent;color:var(--teal);font-size:.82rem;font-weight:600;cursor:pointer;transition:.15s}
.mode-btn.active{background:var(--teal);color:#fff}
.scorebar{display:flex;justify-content:space-between;align-items:center;background:var(--white);border:0.5px solid var(--bm);border-radius:var(--r);padding:9px 16px;margin-bottom:16px;font-size:.85rem;gap:8px;flex-wrap:wrap;box-shadow:var(--shadow)}
.scorebar strong{color:var(--teal)}
.btn-reset{padding:6px 14px;background:transparent;border:1.5px solid var(--bm);border-radius:var(--r);font-size:.8rem;cursor:pointer;color:var(--muted)}
.btn-reset:hover{background:var(--bp)}
.prog-wrap{margin-bottom:16px}
.prog-info{display:flex;justify-content:space-between;font-size:.77rem;color:var(--muted);margin-bottom:5px}
.prog-bg{background:var(--bm);border-radius:20px;height:7px}
.prog-bar{background:var(--teal2);border-radius:20px;height:7px;transition:width .4s}
.q-card{background:var(--white);border-radius:12px;padding:24px 22px 20px;box-shadow:var(--shadow);margin-bottom:14px;animation:fadein .28s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.q-badge{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--teal2);margin-bottom:9px}
.q-text{font-size:.97rem;font-weight:500;line-height:1.65}
.options{margin-top:16px;display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:flex-start;gap:11px;background:var(--bp);border:1.5px solid var(--bm);border-radius:var(--r);padding:11px 13px;cursor:pointer;transition:.15s;font-size:.88rem;line-height:1.5;text-align:left;width:100%}
.opt:hover:not(.disabled){border-color:var(--teal2);background:var(--teal-light)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.ng{background:var(--ng-bg);border-color:var(--ng);color:var(--ng)}
.opt.show-ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.disabled{cursor:default}
.opt-l{min-width:25px;height:25px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.73rem;font-weight:700;background:var(--bm);color:var(--teal);flex-shrink:0;margin-top:1px}
.opt.ok .opt-l,.opt.show-ok .opt-l{background:var(--ok);color:#fff}
.opt.ng .opt-l{background:var(--ng);color:#fff}
.feedback{border-radius:var(--r);padding:12px 15px;font-size:.855rem;margin-top:12px;display:none;line-height:1.6}
.feedback.ok{background:var(--ok-bg);color:var(--ok);border-left:4px solid var(--ok);display:block;border-radius:0 var(--r) var(--r) 0}
.feedback.ng{background:var(--ng-bg);color:var(--ng);border-left:4px solid var(--ng);display:block;border-radius:0 var(--r) var(--r) 0}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}
.btn{padding:9px 22px;border:none;border-radius:var(--r);font-size:.87rem;font-weight:600;cursor:pointer;transition:.15s}
.btn-primary{background:var(--teal);color:#fff}
.btn-primary:hover{background:var(--teal2)}
.btn-secondary{background:transparent;border:1.5px solid var(--bm);color:var(--muted)}
.btn-secondary:hover{background:var(--bp)}
.btn:disabled{opacity:.4;cursor:default}
#score-screen{display:none}
.score-card{background:var(--white);border-radius:14px;padding:34px 26px;box-shadow:var(--shadow);text-align:center}
.sc-emoji{font-size:3.2rem;line-height:1}
.sc-num{font-size:2.8rem;font-weight:700;color:var(--teal);margin:8px 0 3px}
.sc-sub{font-size:.92rem;color:var(--muted)}
.sc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.sc-item{background:var(--bp);border-radius:var(--r);padding:12px 8px}
.sc-val{font-size:1.4rem;font-weight:700}
.sc-lbl{font-size:.73rem;color:var(--muted);margin-top:2px}
.ok-c{color:var(--ok)}.ng-c{color:var(--ng)}
.sc-acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.rev-item{background:var(--white);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.rev-q{font-size:.86rem;font-weight:600;margin-bottom:7px}
.rev-a{font-size:.81rem}
.rev-a.ok{color:var(--ok)}.rev-a.ng{color:var(--ng)}
.rev-c{font-size:.78rem;color:var(--ok);margin-top:3px}
.rev-exp{font-size:.78rem;color:var(--muted);margin-top:5px;font-style:italic}
.study-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.study-nav button{padding:7px 16px;border:1.5px solid var(--bm);border-radius:var(--r);background:transparent;color:var(--muted);font-size:.83rem;cursor:pointer}
.study-nav button:hover{background:var(--bp)}
.study-nav .sn-num{font-size:.85rem;color:var(--teal);font-weight:600}
.reveal-btn{margin-top:14px;padding:8px 18px;background:var(--teal);color:#fff;border:none;border-radius:var(--r);font-size:.85rem;cursor:pointer}
.answer-box{background:var(--ok-bg);color:var(--ok);border-left:4px solid var(--ok);border-radius:0 var(--r) var(--r) 0;padding:12px 15px;font-size:.87rem;margin-top:12px;display:none;line-height:1.6}
@media(max-width:480px){.sc-grid{grid-template-columns:1fr 1fr}.q-card{padding:16px 12px}}
</style>
</head>
<body>

<nav>
  <span class="brand">SIRI Quiz</span>
  <!-- <a href="siri_quiz.html">Atividades 2 e 6</a> -->
  <!-- <a href="siri_quiz2.html" class="active">Questões para a Prova</a>-->
  <button class="mode-btn" onclick="goHome()">⬅ Voltar</button>
</nav>

<div class="wrap">
  <div class="quiz-header">
    <h1>Questões para a Prova SIRI</h1>
    <p id="total-info">88 questões · Todos os módulos · 100% gabaritado</p>
    <div class="mode-row">
      <!--<button class="mode-btn active" onclick="setMode('quiz')">🧠 Quiz</button>-->
      <!-- <button class="mode-btn"        onclick="setMode('study')">📖 Estudo</button> -->
     
    </div>
  </div>

  <div class="scorebar" id="scorebar">
    <span>Acertos: <strong id="sv">0</strong></span>
    <span>Erros: <strong id="ev">0</strong></span>
    <span id="prog-txt" style="color:var(--muted);font-size:.8rem"></span>
    <button class="btn-reset" onclick="resetAll()">↺ Reiniciar</button>
  </div>

  <!-- QUIZ -->
  <div id="quiz-mode">
    <div class="prog-wrap">
      <div class="prog-info"><span id="prog-lbl"></span><span id="prog-pct"></span></div>
      <div class="prog-bg"><div class="prog-bar" id="prog-bar" style="width:0%"></div></div>
    </div>
    <div class="q-card" id="q-card">
      <div class="q-badge"  id="q-badge"></div>
      <div class="q-text"   id="q-text"></div>
      <div class="options"  id="q-opts"></div>
      <div class="feedback" id="q-fb"></div>
    </div>
    <div class="actions">
      <button class="btn btn-secondary" id="btn-skip" onclick="skip()">Pular</button>
      <button class="btn btn-primary"   id="btn-next" onclick="next()" disabled>Próxima →</button>
    </div>
  </div>

  <!-- STUDY -->
  <div id="study-mode" style="display:none">
    <div class="study-nav">
      <button onclick="studyPrev()">← Anterior</button>
      <span class="sn-num" id="sn-num"></span>
      <button onclick="studyNext()">Próxima →</button>
    </div>
    <div class="q-card">
      <div class="q-badge" id="sn-badge"></div>
      <div class="q-text"  id="sn-text"></div>
      <div class="options" id="sn-opts" style="pointer-events:none"></div>
      <button class="reveal-btn" onclick="revealAnswer()">Revelar Resposta</button>
      <div class="answer-box" id="sn-ans"></div>
    </div>
  </div>

  <!-- SCORE -->
  <div id="score-screen">
    <div class="score-card">
      <div class="sc-emoji" id="sc-emoji"></div>
      <div class="sc-num"   id="sc-num"></div>
      <div class="sc-sub"   id="sc-sub"></div>
      <div class="sc-grid">
        <div class="sc-item"><div class="sc-val ok-c" id="sc-ok"></div><div class="sc-lbl">Corretas</div></div>
        <div class="sc-item"><div class="sc-val ng-c" id="sc-ng"></div><div class="sc-lbl">Erradas</div></div>
        <div class="sc-item"><div class="sc-val"      id="sc-sk"></div><div class="sc-lbl">Puladas</div></div>
      </div>
      <div class="sc-acts">
        <button class="btn btn-primary"   onclick="resetAll()">↺ Refazer</button>
        <button class="btn btn-secondary" onclick="toggleReview()">📋 Revisão</button>
      </div>
    </div>
    <div id="rev-section" style="display:none;margin-top:22px">
      <h3 style="font-size:.98rem;color:var(--teal);margin-bottom:12px">Revisão das Respostas</h3>
      <div id="rev-items"></div>
    </div>
  </div>
</div>

<script>
const L=['A','B','C','D'];
const QS=[
{q:'Qual das seguintes NÃO é uma dimensão no Bloco de Construção do Processo?',op:['Integração Vertical','Integração Horizontal','Ciclo de Vida do Produto Integrado','Colaboração Inter e Intra Companhia'],r:3,exp:'Colaboração Inter e Intra Companhia pertence ao Bloco de Construção da Organização (pilar Estrutura e Gestão), não ao Processo.'},
{q:'Qual horizonte de planejamento se concentra em metas de longo prazo?',op:['Estratégico','Tático','Operacional','Nenhuma das anteriores'],r:0,exp:'O horizonte Estratégico se concentra em metas de longo prazo da organização.'},
{q:'Quais dos seguintes níveis de classificação fazem parte da dimensão Competência de Liderança?',op:['Não familiarizado','Compreensão limitada','Semi-dependente','Todas as anteriores'],r:3,exp:'Todos os três níveis fazem parte da dimensão Competência de Liderança.'},
{q:'Qual das seguintes opções descreve melhor o papel do Fator de Custo na Matriz de Priorização?',op:['Calcular a lucratividade geral de um projeto','Avaliar o impacto financeiro da implementação de uma determinada iniciativa','Determinar o orçamento para toda a organização','Avaliar o custo das matérias-primas'],r:1,exp:'O Fator de Custo avalia o impacto financeiro da implementação de uma iniciativa específica.'},
{q:'Todos os equipamentos no chão de fábrica são controlados pelo CLP com Digital Andon. Se algo sair dos parâmetros, um alerta é emitido. A manutenção é reativa. Qual é a classificação correta?',op:['Inteligência no Chão de Fábrica: Banda 2 Visível','Inteligência nas Instalações: Banda 2 Visível','Automação no Chão de Fábrica: Banda 2 Avançado','Integração Vertical: Banda 2 Digital'],r:0,exp:'O sistema monitora e alerta sobre desvios (visibilidade), mas a manutenção ainda é reativa — Inteligência no Chão de Fábrica Banda 2 Visível.'},
{q:'Qual das seguintes NÃO é uma dimensão do Bloco de Construção da Organização?',op:['Aprendizado e Desenvolvimento da Força de Trabalho','Liderar pelo exemplo','Estratégia e Governança','Competência de Liderança'],r:1,exp:'"Liderar pelo exemplo" não é uma dimensão SIRI. As dimensões da Organização são: Aprendizado e Desenvolvimento, Competência de Liderança, Colaboração Inter/Intra e Estratégia e Governança.'},
{q:'Qual pilar se concentra em recursos preditivos?',op:['Automação','Conectividade','Inteligência','Nenhuma das anteriores'],r:2,exp:'O pilar Inteligência é responsável por capacidades analíticas e preditivas.'},
{q:'Os processos de produção são gerenciados com ERP, PLM, MES e WMS. Os humanos gerenciam predominantemente a troca de dados entre diferentes funções. Qual é a classificação correta?',op:['Integração Vertical: Banda 4 Automatizada','Integração Horizontal: Banda 3 Integrada','Integração Vertical: Banda 3 Integrada','Integração Horizontal: Banda 4 Automatizada'],r:2,exp:'Sistemas integrados com troca de dados ainda dependente de intervenção humana — Integração Vertical Banda 3 Integrada.'},
{q:'Em que a Competência de Liderança se concentra?',op:['Conscientização da Indústria 4.0','Desenvolvimento de habilidades','Liderança eficaz','Colaboração interna'],r:0,exp:'A dimensão Competência de Liderança foca na conscientização e compreensão dos líderes sobre a Indústria 4.0.'},
{q:'Qual é o primeiro fator na fórmula da Matriz de Priorização?',op:['Perfil de Custo','Indicadores Chave de Desempenho','Pontuação da Matriz de Avaliação','Referência da Melhor Empresa do Setor'],r:2,exp:'A Pontuação da Matriz de Avaliação é o primeiro fator na fórmula da Matriz de Priorização.'},
{q:'O que a SIRI pretende oferecer às empresas?',op:['Um checklist para transformação','Um roadmap para a Indústria 4.0','Um framework para melhoria contínua','Todas as opções acima'],r:3,exp:'A SIRI oferece tudo isso: um checklist de transformação, um roadmap para a Indústria 4.0 e um framework de melhoria contínua.'},
{q:'Os equipamentos no chão de fábrica estão ligados via rede de TI segura com transferência em tempo real. A arquitetura pode ser reconfigurada via plug-and-play (TSN, IIoT, nuvem, móveis). Qual é a classificação?',op:['Conectividade no Chão de Fábrica: Banda 4 Tempo Real','Automação no Chão de Fábrica: Banda 4 Flexível','Inteligência no Chão de Fábrica: Banda 5 Adaptável','Conectividade no Chão de Fábrica: Banda 5 Escalável'],r:3,exp:'Rede segura em tempo real E arquitetura reconfigurável via plug-and-play — Conectividade no Chão de Fábrica Banda 5 Escalável.'},
{q:'Qual dimensão está especificamente relacionada ao pilar "Cadeia de Suprimentos"?',op:['Integração Vertical','Integração Horizontal','Ciclo de Vida do Produto Integrado','Nenhuma das anteriores'],r:1,exp:'A Integração Horizontal trata da integração de informações ao longo da cadeia de suprimentos.'},
{q:'Quais são os dois Arquétipos de Transformação que pontuam alto no nível de maturidade SIRI?',op:['Tundra e Floresta Tropical','Savana e Tundra','Floresta Tropical e Floresta de Coníferas','Floresta de Coníferas e Tundra'],r:2,exp:'Floresta Tropical (alta maturidade, alta variância) e Floresta de Coníferas (alta maturidade, baixa variância) pontuam alto em maturidade SIRI.'},
{q:'Em que Estratégia e Governança se concentram?',op:['Planejamento estratégico','Desenvolvimento de habilidades','Liderança eficaz','Colaboração interna'],r:0,exp:'A dimensão Estratégia e Governança foca no planejamento estratégico e na estrutura de governança da organização.'},
{q:'Qual pilar abrange o planejamento e a execução de processos que levam à produção de bens e serviços?',op:['Operações','Cadeia de Suprimentos','Ciclo de Vida do Produto','Nenhuma das anteriores'],r:0,exp:'O pilar Operações abrange o planejamento e execução dos processos de produção de bens e serviços.'},
{q:'O que TIER significa na Estrutura TIER?',op:['Tempo, Impacto, Eficiência, Resultados','Estado Atual, Impacto no Resultado Final, Objetivos de Negócios Essenciais e Referência','Tecnologia, Inovação, Eficiência, Resultados','Nenhuma das Anteriores'],r:1,exp:'TIER significa: Today\'s State, Impact on End Result, Essential Business Objectives e Reference.'},
{q:'Qual é o foco principal da Indústria 4.0?',op:['Automação','Digitalização e Interconectividade','Fabricação just-in-time','Terceirização'],r:1,exp:'O foco principal da Indústria 4.0 é a Digitalização e Interconectividade dos sistemas de produção.'},
{q:'As máquinas do chão de fábrica são operadas automaticamente pelo DCS sem envolvimento humano. A intervenção humana é necessária apenas para verificações de segurança e mau funcionamento. Qual é a classificação?',op:['Inteligência no Chão de Fábrica: Banda 2 Visível','Automação no Chão de Fábrica: Banda 2 Avançada','Inteligência no Chão de Fábrica: Banda 3 Diagnóstico','Automação no Chão de Fábrica: Banda 3 Completa'],r:3,exp:'Operação pelo DCS com mínima intervenção humana — Automação no Chão de Fábrica Banda 3 Completa.'},
{q:'As operações de fabricação são realizadas por TI e TO conectados por protocolo padrão. As ordens de serviço são gerenciadas e transferidas diretamente para produção autônoma. Qual é a classificação?',op:['Conectividade no Chão de Fábrica: Banda 3 Interoperável e Segura','Automação no Chão de Fábrica: Banda 3 Completa','Integração Vertical: Banda 4 Automatizada','Integração Vertical: Banda 3 Integrada'],r:2,exp:'Integração total entre TI e TO com produção autônoma a partir de ordens de compra — Integração Vertical Banda 4 Automatizada.'},
{q:'Qual dos seguintes NÃO é um fator de KPI?',op:['Qualidade','Velocidade','Lucratividade','Nenhuma das anteriores'],r:2,exp:'Lucratividade não é um fator de KPI padrão na Matriz de Priorização SIRI.'},
{q:'Qual é o principal benefício da integração vertical na Indústria 4.0?',op:['Ganho de eficiência; transferência clara de informações entre planejamento de negócios e processos de produção','Melhorar a qualidade e a flexibilidade das operações de fabricação','Agilidade; insights e análises de fábrica em tempo real','Todas as opções acima'],r:3,exp:'A integração vertical traz todos esses benefícios: eficiência, qualidade, flexibilidade e agilidade.'},
{q:'A maioria dos processos de produção é executada automaticamente pelo CLP. Porém, os operadores são obrigados a monitorar o estado de saúde das máquinas e resolver problemas. Qual é a classificação?',op:['Automação no Chão de Fábrica: Banda 1 Básica','Automação no Chão de Fábrica: Banda 2 Avançada','Inteligência no Chão de Fábrica: Banda 1 Informatizada/Computadorizada','Inteligência no Chão de Fábrica: Banda 2 Visível'],r:1,exp:'Automação via CLP com monitoramento humano necessário — Automação no Chão de Fábrica Banda 2 Avançada.'},
{q:'A maioria das atividades empresariais é gerenciada pelo ERP. Planejamento, Compras e RH estão integrados, permitindo geração automática de relatórios. Porém, ainda há intervenção humana no fluxo de trabalho. Qual é a classificação?',op:['Automação na Empresa: Banda 2 Avançada','Integração Vertical: Banda 3 Integrada','Inteligência na Empresa: Banda 2 Visível','Integração Horizontal: Banda 3 Integrada'],r:0,exp:'ERP integrando vários departamentos com geração automática de relatórios, mas ainda com intervenção humana — Automação na Empresa Banda 2 Avançada.'},
{q:'O que a dimensão "Integração Vertical" avalia?',op:['Conexões entre sistemas ERP e de chão de fábrica','Integração em toda a cadeia de suprimentos','Desenvolvimento de novos produtos','Colaboração horizontal entre departamentos'],r:0,exp:'A Integração Vertical avalia as conexões entre sistemas de TI e TO, especialmente entre ERP e sistemas de chão de fábrica.'},
{q:'Qual das alternativas a seguir é um desafio na implementação da Indústria 4.0?',op:['Riscos de segurança cibernética','Sobrecarga de dados','Lacunas de habilidades','Todas as opções acima'],r:3,exp:'Todos são desafios reais: riscos cibernéticos, excesso de dados e falta de pessoal qualificado.'},
{q:'Qual é o foco da etapa "Avaliar" no framework LEAD?',op:['Aprender os conceitos chave','Avaliações abrangentes','Estratégia e roadmap','Implementação'],r:1,exp:'No LEAD, a etapa "Avaliar" (Assess) foca em realizar avaliações abrangentes da maturidade da organização.'},
{q:'Qual é o último fator na Fórmula da Matriz de Priorização?',op:['Referência da Melhor Empresa do Setor','Indicadores Chave de Desempenho','Perfil de Custo','Pontuação da Matriz de Avaliação'],r:0,exp:'A Referência da Melhor Empresa do Setor é o último fator na fórmula da Matriz de Priorização.'},
{q:'O que a Conectividade visa alcançar?',op:['Análise de dados','Controle de produção','Coleta e compartilhamento de dados','Nenhuma das anteriores'],r:2,exp:'O pilar Conectividade visa alcançar a coleta e compartilhamento de dados entre sistemas, máquinas e pessoas.'},
{q:'Qual é o nível de classificação mais alto para Aprendizado e Desenvolvimento da Força de Trabalho?',op:['Adaptativo','Integrado','Contínuo','Voltado para o futuro'],r:0,exp:'"Adaptativo" é o nível mais alto de classificação para a dimensão Aprendizado e Desenvolvimento da Força de Trabalho.'},
{q:'Qual tecnologia NÃO é comumente associada à Indústria 4.0?',op:['Internet das Coisas (IoT)','Inteligência Artificial Generativa','Computação de borda','Sistemas SCADA'],r:1,exp:'Inteligência Artificial Generativa é uma tecnologia mais recente e não está listada como tecnologia central da Indústria 4.0.'},
{q:'De acordo com o Relatório de Insights de Transformação, o que é enfatizado como o aspecto mais discrepante no Bloco de Tecnologia?',op:['Maximização do lucro','Automação Avançada','Conectividade','Eficiência da força de trabalho'],r:2,exp:'O Relatório de Insights SIRI aponta a Conectividade como o aspecto mais discrepante no Bloco de Tecnologia.'},

let mode='quiz',idx=0,score=0,errs=0,skips=0,answered=false,results=[],studyIdx=0;

function renderQ(){
  answered=false;
  const q=QS[idx];
  document.getElementById('q-badge').textContent='Questão '+(idx+1)+' de '+QS.length;
  document.getElementById('q-text').textContent=q.q;
  document.getElementById('q-fb').className='feedback';
  document.getElementById('btn-next').disabled=true;
  document.getElementById('btn-skip').disabled=false;
  const opts=document.getElementById('q-opts');
  opts.innerHTML='';
  q.op.forEach((op,i)=>{
    const b=document.createElement('button');
    b.className='opt';b.dataset.i=i;
    b.innerHTML=`<span class="opt-l">${L[i]}</span><span>${op}</span>`;
    b.addEventListener('click',()=>pick(i));
    opts.appendChild(b);
  });
  const pct=Math.round(idx/QS.length*100);
  document.getElementById('prog-lbl').textContent='Questão '+(idx+1)+' de '+QS.length;
  document.getElementById('prog-pct').textContent=pct+'%';
  document.getElementById('prog-bar').style.width=pct+'%';
  document.getElementById('prog-txt').textContent='Respondidas: '+idx+'/'+QS.length;
  const c=document.getElementById('q-card');
  c.style.animation='none';requestAnimationFrame(()=>{c.style.animation='';});
}

function pick(chosen){
  if(answered)return;
  answered=true;
  const q=QS[idx];const ok=chosen===q.r;
  document.querySelectorAll('#q-opts .opt').forEach((el,i)=>{
    el.classList.add('disabled');
    if(i===q.r)el.classList.add('show-ok');
    if(i===chosen&&ok)el.classList.add('ok');
    if(i===chosen&&!ok)el.classList.add('ng');
  });
  const fb=document.getElementById('q-fb');
  if(ok){fb.className='feedback ok';fb.textContent='✓ Correto!'+(q.exp?' – '+q.exp:'');score++;}
  else{fb.className='feedback ng';fb.textContent='✗ Incorreto. Resposta: '+L[q.r]+') '+q.op[q.r]+(q.exp?' — '+q.exp:'');errs++;}
  results.push({q,chosen,ok,skipped:false});
  document.getElementById('sv').textContent=score;
  document.getElementById('ev').textContent=errs;
  document.getElementById('btn-next').disabled=false;
  document.getElementById('btn-skip').disabled=true;
}

function skip(){
  if(answered)return;
  results.push({q:QS[idx],chosen:-1,ok:false,skipped:true});
  skips++;next();
}

function next(){
  idx++;
  if(idx>=QS.length){showScore();return;}
  renderQ();
}

function showScore(){
  document.getElementById('quiz-mode').style.display='none';
  document.getElementById('score-screen').style.display='';
  document.getElementById('scorebar').style.display='none';
  const pct=Math.round(score/QS.length*100);
  document.getElementById('sc-emoji').textContent=pct>=80?'🎉':pct>=60?'👍':'📚';
  document.getElementById('sc-num').textContent=pct+'%';
  document.getElementById('sc-sub').textContent=score+' de '+QS.length+' corretas';
  document.getElementById('sc-ok').textContent=score;
  document.getElementById('sc-ng').textContent=errs;
  document.getElementById('sc-sk').textContent=skips;
  document.getElementById('prog-bar').style.width='100%';
  document.getElementById('prog-pct').textContent='100%';
}

function toggleReview(){
  const sec=document.getElementById('rev-section');
  if(sec.style.display!=='none'){sec.style.display='none';return;}
  sec.style.display='';
  const c=document.getElementById('rev-items');c.innerHTML='';
  results.forEach((r,i)=>{
    const d=document.createElement('div');d.className='rev-item';
    let h=`<div class="rev-q">${i+1}. ${r.q.q}</div>`;
    if(r.skipped)h+=`<div class="rev-a" style="color:var(--muted)">Pulada — correta: ${L[r.q.r]}) ${r.q.op[r.q.r]}</div>`;
    else if(r.ok)h+=`<div class="rev-a ok">✓ ${L[r.chosen]}) ${r.q.op[r.chosen]}</div>`;
    else{h+=`<div class="rev-a ng">✗ Sua: ${L[r.chosen]}) ${r.q.op[r.chosen]}</div>`;h+=`<div class="rev-c">✓ Correta: ${L[r.q.r]}) ${r.q.op[r.q.r]}</div>`;}
    if(r.q.exp)h+=`<div class="rev-exp">${r.q.exp}</div>`;
    d.innerHTML=h;c.appendChild(d);
  });
}

function renderStudy(){
  const q=QS[studyIdx];
  document.getElementById('sn-badge').textContent='Questão '+(studyIdx+1)+' de '+QS.length;
  document.getElementById('sn-text').textContent=q.q;
  document.getElementById('sn-ans').style.display='none';
  const opts=document.getElementById('sn-opts');opts.innerHTML='';
  q.op.forEach((op,i)=>{
    const b=document.createElement('button');b.className='opt disabled';
    b.innerHTML=`<span class="opt-l">${L[i]}</span><span>${op}</span>`;
    opts.appendChild(b);
  });
  document.getElementById('sn-num').textContent=(studyIdx+1)+' / '+QS.length;
}

function revealAnswer(){
  const q=QS[studyIdx];
  document.querySelectorAll('#sn-opts .opt').forEach((el,i)=>{if(i===q.r)el.classList.add('show-ok');});
  const a=document.getElementById('sn-ans');
  a.textContent='✓ '+L[q.r]+') '+q.op[q.r]+(q.exp?' — '+q.exp:'');
  a.style.display='block';
}

function studyNext(){studyIdx=(studyIdx+1)%QS.length;renderStudy();}
function studyPrev(){studyIdx=(studyIdx-1+QS.length)%QS.length;renderStudy();}

function setMode(m){
  mode=m;
  document.querySelectorAll('.mode-btn').forEach((b,i)=>b.classList.toggle('active',['quiz','study'][i]===m));
  document.getElementById('quiz-mode').style.display=m==='quiz'?'':'none';
  document.getElementById('study-mode').style.display=m==='study'?'':'none';
  document.getElementById('score-screen').style.display='none';
  document.getElementById('scorebar').style.display=m==='quiz'?'':'none';
  if(m==='study')renderStudy();
}

function resetAll(){
  idx=0;score=0;errs=0;skips=0;results=[];
  document.getElementById('sv').textContent='0';
  document.getElementById('ev').textContent='0';
  document.getElementById('score-screen').style.display='none';
  document.getElementById('rev-section').style.display='none';
  document.getElementById('scorebar').style.display=mode==='quiz'?'':'none';
  if(mode==='quiz'){document.getElementById('quiz-mode').style.display='';renderQ();}
  else renderStudy();
}

  function goHome(){
  window.location.href = "index.html";
}

renderQ();
</script>
</body>
</html>
